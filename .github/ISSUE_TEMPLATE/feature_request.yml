name: Feature request
description: Propose a reusable Cloudflare-native CRM capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include tenant, authorization, data ownership, and failure semantics.
    validations:
      required: true
  - type: textarea
    id: cloudflare
    attributes:
      label: Cloudflare resources
      description: Identify any new bindings, limits, costs, migrations, or secrets.
