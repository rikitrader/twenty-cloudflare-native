name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run patch:twenty
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrations:check
      - run: npm run audit:mutations
      - run: npm run cost:starter:check
      - run: npm run security:production:check
      - run: npm audit --omit=dev --audit-level=high
