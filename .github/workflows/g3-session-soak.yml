name: G3 Production Session Soak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twenty-g3-session-soak
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the production G3 ledger
        env:
          PRODUCTION_URL: https://twenty-crm.rikitrader.workers.dev
          CAPTURED_AT: "${{ github.run_started_at }}"
        run: |
          set -eu
          ledger=$(curl --fail-with-body --silent --show-error --max-time 30 \
            "$PRODUCTION_URL/_status/g3")
          export LEDGER="$ledger" CAPTURED_AT PRODUCTION_URL
          node -e 'const fs=require("fs"); const ledger=JSON.parse(process.env.LEDGER); if(ledger.gate!=="G3" || typeof ledger.ready!=="boolean" || ledger.status!=="passed" && ledger.status!=="collecting") throw new Error("invalid production G3 ledger"); const body={capturedAt:process.env.CAPTURED_AT,worker:process.env.PRODUCTION_URL,ledger,result:ledger.lastPassed===false?"failed":"observed"}; fs.writeFileSync("g3-session-soak.json",JSON.stringify(body,null,2)); if(ledger.lastPassed===false) process.exitCode=1;'
      - name: Upload soak observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g3-session-soak-${{ github.run_id }}
          path: g3-session-soak.json
          if-no-files-found: error
          retention-days: 30
