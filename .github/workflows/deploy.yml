name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: twenty-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun audit
      # Requires repo secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
      # Containers:Edit, Workers KV:Edit on account e9a13cb0...).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            deploy --strict --containers-rollout gradual
            --tag "${{ github.sha }}"
            --message "GitHub Actions ${{ github.sha }}"
