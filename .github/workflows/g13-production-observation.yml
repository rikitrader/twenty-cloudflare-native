name: G13 Production Observation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      observation_url:
        description: "Production Worker URL after the controlled Redis-free cutover"
        required: false
        default: "https://twenty-crm.rikitrader.workers.dev"

permissions:
  contents: read

jobs:
  observation:
    if: github.event_name == 'workflow_dispatch' || vars.G13_OBSERVATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun run scripts/run-production-observation.mjs
        env:
          OBSERVATION_URL: ${{ inputs.observation_url }}
      - name: Preserve observation sample
        if: always()
        run: |
          bun run scripts/run-production-observation.mjs > g13-observation.json
        env:
          OBSERVATION_URL: ${{ inputs.observation_url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: g13-production-observation-${{ github.run_id }}
          path: g13-observation.json
          if-no-files-found: error
          retention-days: 90
